<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MADO — Restaurant & Grill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     1) CONFIGURATION VISUELLE — à modifier en un seul endroit
     ============================================================ */
  :root{
    --corail: #E85D34;
    --corail-dark: #C8481F;
    --jaune: #F5A93B;
    --vert: #1F3D2B;
    --creme: #FBF4EA;
    --creme-2: #F1E9DB;
    --noir: #241C15;
    --gris: #6B6055;
    --whatsapp: #25D366;

    --font-display: 'Fraunces', serif;
    --font-body: 'Manrope', sans-serif;
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--creme); color:var(--noir); font-family:var(--font-body); overscroll-behavior-y:none;}
  img{display:block; max-width:100%;}
  button{font-family:inherit; border:none; background:none; cursor:pointer;}
  a{text-decoration:none; color:inherit;}

  .app{max-width:460px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:110px; background:var(--creme);}

  /* ============================================================
     HEADER / MINI HERO
     ============================================================ */
  .hero{
    position:relative;
    height:280px;
    overflow:hidden;
  }
  .hero img{width:100%; height:100%; object-fit:cover;}
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(36,28,21,.05) 0%, rgba(36,28,21,.55) 70%, var(--creme) 100%);
  }
  .hero-content{
    position:absolute; left:0; right:0; bottom:0;
    padding:0 22px 22px;
    z-index:2;
    display:flex; flex-direction:column; gap:4px;
  }
  .hero-badge{
    position:absolute; top:16px; left:16px; z-index:3;
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(251,244,234,0.16);
    backdrop-filter:blur(10px);
    color:var(--creme);
    font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding:7px 12px; border-radius:99px;
  }
  .hero-badge svg{width:12px; height:12px;}
  .logo{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:600;
    font-size:2.75rem;
    line-height:.9;
    color:var(--creme);
    letter-spacing:-0.01em;
  }
  .signature{
    font-size:11px;
    font-weight:700;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--jaune);
    margin-bottom:2px;
  }
  .hours{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:rgba(251,244,234,.85); font-weight:600; margin-top:6px;
  }
  .hours svg{width:13px; height:13px; opacity:.9;}

  /* ============================================================
     NAVIGATION CATÉGORIES
     ============================================================ */
  .cat-nav-wrap{
    position:sticky; top:0; z-index:20;
    background:var(--creme);
    padding:14px 0 10px;
    border-bottom:1px solid rgba(36,28,21,0.05);
  }
  .cat-nav{
    display:flex; gap:8px;
    overflow-x:auto;
    padding:0 18px;
    scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0;
    padding:11px 18px;
    border-radius:99px;
    font-size:13.5px;
    font-weight:700;
    background:var(--creme-2);
    color:var(--noir);
    transition:background .25s, color .25s, transform .15s;
  }
  .cat-chip:active{transform:scale(.95);}
  .cat-chip.active{
    background:var(--corail);
    color:var(--creme);
    box-shadow:0 6px 16px rgba(232,93,52,0.35);
  }

  /* ============================================================
     GRILLE PRODUITS
     ============================================================ */
  .section-title{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:600;
    font-size:1.5rem;
    padding:20px 20px 12px;
    color:var(--noir);
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:0 18px 10px;
  }
  .card{
    background:var(--creme-2);
    border-radius:22px;
    overflow:hidden;
    text-align:left;
    opacity:0;
    transform:translateY(14px) scale(.98);
    animation:pop .5s cubic-bezier(.22,1,.36,1) forwards;
  }
  .card:active{transform:scale(.97) !important;}
  .card-img-wrap{position:relative; aspect-ratio:1/1; overflow:hidden;}
  .card-img-wrap img{width:100%; height:100%; object-fit:cover; transition:transform .5s ease;}
  .add-btn{
    position:absolute; bottom:9px; right:9px;
    width:36px; height:36px; border-radius:50%;
    background:var(--corail);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    transition:transform .15s;
  }
  .add-btn:active{transform:scale(.85);}
  .add-btn svg{width:17px; height:17px; stroke:var(--creme); stroke-width:2.75;}
  .card-body{padding:12px 13px 14px;}
  .card-name{font-size:14.5px; font-weight:800; line-height:1.2; margin-bottom:4px;}
  .card-desc{font-size:11.5px; color:var(--gris); line-height:1.4; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-price{font-size:14px; font-weight:800; color:var(--corail-dark);}

  /* ============================================================
     FICHE PRODUIT (bottom sheet)
     ============================================================ */
  .overlay{
    position:fixed; inset:0; z-index:50;
    display:none;
    align-items:flex-end;
    justify-content:center;
  }
  .overlay.open{display:flex;}
  .overlay-bg{
    position:absolute; inset:0;
    background:rgba(36,28,21,.55);
    opacity:0;
    transition:opacity .25s ease;
  }
  .overlay.open .overlay-bg{opacity:1;}
  .sheet{
    position:relative; width:100%; max-width:460px;
    background:var(--creme);
    border-radius:28px 28px 0 0;
    transform:translateY(100%);
    transition:transform .38s cubic-bezier(.22,1,.36,1);
    max-height:88vh;
    overflow-y:auto;
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-img-wrap{position:relative; height:260px;}
  .sheet-img-wrap img{width:100%; height:100%; object-fit:cover;}
  .close-btn{
    position:absolute; top:16px; right:16px;
    width:34px; height:34px; border-radius:50%;
    background:rgba(36,28,21,.5); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
  }
  .close-btn svg{width:16px; height:16px; stroke:var(--creme); stroke-width:2.4;}
  .sheet-body{padding:22px 24px 30px;}
  .sheet-name{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:1.6rem; margin-bottom:6px;}
  .sheet-desc{font-size:14px; color:var(--gris); line-height:1.5; margin-bottom:16px;}
  .sheet-price{font-size:1.25rem; font-weight:800; color:var(--corail-dark); margin-bottom:22px;}
  .sheet-actions{display:flex; align-items:center; gap:14px;}
  .stepper{display:flex; align-items:center; gap:14px; background:var(--creme-2); border-radius:99px; padding:6px;}
  .stepper button{width:36px; height:36px; border-radius:50%; background:var(--creme); display:flex; align-items:center; justify-content:center; transition:transform .15s;}
  .stepper button:active{transform:scale(.85);}
  .stepper button.plus{background:var(--corail);}
  .stepper button.plus svg{stroke:var(--creme);}
  .stepper svg{width:15px; height:15px; stroke:var(--noir); stroke-width:2.5;}
  .stepper span{min-width:16px; text-align:center; font-weight:800; font-size:15px;}
  .btn-add-order{
    flex:1; padding:16px; border-radius:18px;
    background:var(--vert); color:var(--creme);
    font-weight:800; font-size:15px;
    box-shadow:0 10px 24px rgba(31,61,43,.3);
    transition:transform .15s;
  }
  .btn-add-order:active{transform:scale(.97);}

  /* ============================================================
     PANIER FLOTTANT + DRAWER
     ============================================================ */
  .cart-bar{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    width:calc(100% - 36px); max-width:424px;
    background:var(--vert); color:var(--creme);
    border-radius:20px; padding:16px 20px;
    display:none; align-items:center; justify-content:space-between;
    box-shadow:0 14px 30px rgba(31,61,43,.4);
    z-index:40;
    transition:transform .2s;
  }
  .cart-bar.visible{display:flex;}
  .cart-bar:active{transform:translateX(-50%) scale(.98);}
  .cart-bar-left{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14.5px;}
  .cart-bar-left svg{width:18px; height:18px; stroke:var(--creme);}
  .cart-bar-right{font-weight:800; font-size:15px; letter-spacing:.01em;}

  .cart-sheet{max-height:82vh; display:flex; flex-direction:column;}
  .cart-header{display:flex; align-items:center; justify-content:space-between; padding:22px 22px 14px;}
  .cart-title{font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;}
  .cart-close{width:34px; height:34px; border-radius:50%; background:var(--creme-2); display:flex; align-items:center; justify-content:center;}
  .cart-close svg{width:15px; height:15px; stroke:var(--noir); stroke-width:2.4;}
  .cart-items{flex:1; overflow-y:auto; padding:0 22px;}
  .cart-empty{padding:40px 0; text-align:center; color:var(--gris); font-size:13.5px;}
  .cart-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--creme-2);}
  .cart-item img{width:60px; height:60px; border-radius:14px; object-fit:cover; flex-shrink:0;}
  .cart-item-info{flex:1; min-width:0;}
  .cart-item-name{font-weight:800; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cart-item-price{font-size:12px; font-weight:700; color:var(--corail-dark);}
  .cart-item-stepper{display:flex; align-items:center; gap:8px; background:var(--creme-2); border-radius:99px; padding:5px;}
  .cart-item-stepper button{width:26px; height:26px; border-radius:50%; background:var(--creme); display:flex; align-items:center; justify-content:center;}
  .cart-item-stepper button.plus{background:var(--corail);}
  .cart-item-stepper button.plus svg{stroke:var(--creme);}
  .cart-item-stepper svg{width:12px; height:12px; stroke:var(--noir); stroke-width:2.5;}
  .cart-item-stepper span{min-width:14px; text-align:center; font-weight:800; font-size:13px;}
  .cart-footer{padding:18px 22px 28px; border-top:1px solid var(--creme-2);}
  .cart-total-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .cart-total-label{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--gris);}
  .cart-total-value{font-size:1.3rem; font-weight:800;}
  .btn-whatsapp{
    display:flex; align-items:center; justify-content:center; gap:9px;
    width:100%; padding:17px; border-radius:18px;
    background:var(--whatsapp); color:#0B3D19;
    font-weight:800; font-size:15px;
    box-shadow:0 10px 26px rgba(37,211,102,.4);
    animation:pulseSoft 2.4s ease-in-out infinite;
    transition:transform .15s;
  }
  .btn-whatsapp:active{transform:scale(.97);}
  .btn-whatsapp.disabled{opacity:.35; pointer-events:none; animation:none;}
  .btn-whatsapp svg{width:19px; height:19px; fill:#0B3D19; stroke:none;}

  /* ============================================================
     TOAST
     ============================================================ */
  .toast{
    position:fixed; top:20px; left:50%; transform:translate(-50%,-14px);
    background:var(--noir); color:var(--creme);
    padding:11px 20px; border-radius:99px;
    font-size:13px; font-weight:700;
    opacity:0; z-index:60;
    transition:opacity .25s, transform .25s;
    pointer-events:none;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  /* ============================================================
     ANIMATIONS
     ============================================================ */
  @keyframes pop{ to{opacity:1; transform:translateY(0) scale(1);} }
  @keyframes pulseSoft{
    0%,100%{ box-shadow:0 10px 26px rgba(37,211,102,.4); }
    50%{ box-shadow:0 10px 34px rgba(37,211,102,.6); }
  }
</style>
</head>
